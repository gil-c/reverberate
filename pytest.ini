[pytest]
pythonpath = src
testpaths = tests
markers =
    slow: needs the HSSD download, which neither the default run nor the CI has (make test-slow)
    nightly: worth its time but not on every pull request; run by the full workflow (make test-full)
    quarantine: does not give one result every run on the CI; run by a job of its own that blocks nothing (make test-quarantine)
addopts = -m "not slow and not nightly and not quarantine"
