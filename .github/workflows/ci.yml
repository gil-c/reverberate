name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request pushed again stops the run of the push before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Lint, types and tests side by side, so the wait is the longest and not the sum.
# The coverage table and the tests marked nightly are the full workflow's
# (full.yml): no threshold reads the table, so no pull request waits for it.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "$(grep '^ruff' requirements-dev.txt)"

      - name: make lint
        run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install project
        run: uv pip install --system --compile-bytecode -r requirements-dev.txt

      # mypy checks again only what changed since the cache was written.
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('requirements*.txt', 'mypy.ini') }}-${{ github.sha }}
          restore-keys: mypy-${{ hashFiles('requirements*.txt', 'mypy.ini') }}-

      - name: make typecheck
        run: make typecheck

  # The test files in three jobs, one file in three each by its place in the
  # list of names: a runner is one and a half times slower than another from
  # one run to the next, and a third of the suite is under a minute on the
  # slow one.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        third: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install project
        run: uv pip install --system --compile-bytecode -r requirements-dev.txt

      # One process a core. A file's tests stay in one process, so what a
      # module computes once for several of them is computed once. The
      # libraries' own pools are held to one thread a process: four processes
      # that each start four of them wait on one another, and a test of one
      # second took five minutes.
      - name: pytest
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: |
          files=$(ls tests/test_*.py | awk -v third=${{ matrix.third }} 'NR % 3 == third')
          pytest -n auto --dist loadfile --durations=25 $files

  # The tests marked quarantine: kept running and in sight on every pull
  # request, five times over so that a run says how often they fail. The job
  # is red when one fails and the pull request is not held by it, until the
  # cause is closed (docs/open-questions/engine-speed.md, "the same bytes").
  quarantine:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install project
        run: uv pip install --system --compile-bytecode -r requirements-dev.txt

      - name: make test-quarantine, five times
        run: |
          failed=0
          for run in 1 2 3 4 5; do
            make test-quarantine || failed=$((failed + 1))
          done
          echo "failed $failed of 5"
          test "$failed" -eq 0
