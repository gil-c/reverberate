name: Full

# Everything a pull request does not wait for: the default run and the tests
# marked nightly, with the coverage table. After every merge into main or into
# the integration branch, every night on the default branch, and by hand.
on:
  push:
    branches: [main, clarify-simulator]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install project
        run: uv pip install --system --compile-bytecode -r requirements-dev.txt

      # One process a core, and the libraries' own pools one thread a process,
      # as in the CI workflow and for its reason.
      - name: make test-full
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: make test-full PYTEST_ADDOPTS="-n auto --dist loadfile"
