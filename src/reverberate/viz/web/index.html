<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>reverberate — reconstructed room</title>
    <style>
      body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #0d0f12; }
      canvas { display: block; cursor: grab; }
      canvas.dragging { cursor: grabbing; }
      #ui {
        position: absolute; top: 12px; left: 12px; z-index: 10;
        background: rgba(20, 22, 26, 0.88); color: #eee;
        padding: 12px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5;
        max-width: 290px; user-select: none;
      }
      button {
        background: #2d3038; color: #eee; border: 1px solid #454a55;
        border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 13px;
      }
      button.active { background: #3f6ea5; border-color: #5b8fd0; }
      #legend { margin-top: 10px; max-height: 42vh; overflow-y: auto; }
      .entry { display: flex; align-items: center; gap: 7px; font-size: 11px; padding: 1px 0; }
      .swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; }
      #hint { margin-top: 9px; color: #99aabb; font-size: 11px; }
      select {
        width: 100%; background: #2d3038; color: #eee; border: 1px solid #454a55;
        border-radius: 5px; padding: 5px; font-size: 12px;
      }
      #busy { margin-top: 6px; color: #d8a95f; font-size: 11px; }
      select {
        width: 100%; background: #2d3038; color: #eee; border: 1px solid #454a55;
        border-radius: 5px; padding: 5px; font-size: 12px;
      }
      #busy { margin-top: 6px; color: #d0a860; font-size: 11px; }
      #report { margin-top: 5px; color: #7a8290; font-size: 10px; }
      button:disabled { opacity: .38; cursor: not-allowed; }
      /* The solver panel is an overlay like #ui, not a layout column, so the
         renderer keeps the whole window and its size never depends on how much
         text the panel holds. */
      #run-panel {
        position: fixed; top: 0; right: 0; bottom: 0; width: 25rem; max-width: 42vw;
        overflow-y: auto; padding: 1rem 1.1rem 3rem;
        background: rgba(25, 28, 33, 0.94); border-left: 1px solid #2b3038;
        font: 13px/1.5 system-ui, sans-serif; color: #e6e8eb;
      }
      #run-panel[hidden] { display: none; }
      #run-panel h1 { font-size: 1rem; margin: 0 0 .2rem; }
      #run-panel h2 {
        font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
        color: #8d97a5; margin: 1.4rem 0 .5rem;
      }
      #run-panel .sub { color: #8d97a5; margin: 0 0 .6rem; font-size: .8rem; word-break: break-all; }
      #run-panel table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      #run-panel th, #run-panel td {
        text-align: right; padding: .18rem .3rem; border-bottom: 1px solid #262b33;
      }
      #run-panel th:first-child, #run-panel td:first-child { text-align: left; }
      #run-panel th { color: #8d97a5; font-weight: 500; }
      #run-panel td.out { color: #6b7280; }
      #run-panel canvas.plot {
        width: 100%; height: 88px; display: block; background: #101317;
        border: 1px solid #2b3038; border-radius: 5px;
      }
      #run-panel audio { width: 100%; margin-top: .3rem; }
      #run-panel .legend { display: flex; flex-wrap: wrap; gap: .25rem .6rem; }
      #run-panel .legend span { display: flex; align-items: center; gap: .3rem; font-size: .78rem; }
      #run-panel .swatch { width: .7rem; height: .7rem; border-radius: 2px; border: 1px solid #00000060; }
      #run-panel .note { color: #b9a06a; font-size: .78rem; }
      #run-panel .caption { color: #8d97a5; font-size: .74rem; margin: .2rem 0 .7rem; }
      #run-panel select { width: 100%; }
    </style>
  </head>
  <body>
    <div id="ui">
      <select id="scene-select"><option>loading apartments…</option></select>
      <div style="margin-top: 6px"><strong id="title">loading…</strong></div>
      <div style="margin-top: 8px">
        <button id="btn-colour" class="active">Colour</button>
        <button id="btn-label">Label</button>
        <button id="btn-acoustic" title="what the wave solver read and returned">Acoustic</button>
        <!-- Shown only when an apartment has more than one run. With one there
             is nothing to choose, and a select of one is furniture. -->
        <select id="run-choice" hidden title="which solver run to open"></select>
      </div>
      <div id="legend"></div>
      <div id="hint">Drag to look around. W A S D to walk.</div>
      <div id="report"></div>
      <div id="busy"></div>
    </div>
    <div id="run-panel" hidden></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
      import { buildAuditGrid, buildRunGroup, buildVoxelCloud, loadRun, renderRunPanel } from "./solver_mode.js";

      // Eye height of a standing adult, in metres, held constant: a person's
      // head does not rise when they look up. Body translation and head
      // rotation are the only things that ever move this camera.
      const EYE_HEIGHT = 1.6;
      const WALK_SPEED = 2.2;
      // Stay this far from the walls, so the near plane never slips through a
      // surface and the room cannot be left.
      const WALL_MARGIN = 0.22;
      const MAX_PITCH = Math.PI / 2 - 0.05;
      const LOOK_SENSITIVITY = 0.0032;
      //: Radians per second when turning on the spot with the arrow keys. About
      //: 100 degrees a second, so a quarter turn takes under a second and a
      //: listener can face a source without letting go of the keyboard.
      const TURN_SPEED = 1.75;
      //: The widest the field of view ever gets. The wheel zooms in from here
      //: and stops at this value going back out, so a reader cannot roll
      //: themselves into a fish eye that misrepresents where anything is.
      const BASE_FOV = 70;
      const MIN_FOV = 12;
      const SCENE_MODES = ["colour", "label"];
      // The solver mode is listed with the others so the buttons stay one set,
      // but it is built from a run payload rather than from the HSSD assembly.
      const MODES = [...SCENE_MODES, "acoustic"];

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d0f12);
      const camera = new THREE.PerspectiveCamera(BASE_FOV, innerWidth / innerHeight, 0.05, 200);
      camera.rotation.order = "YXZ";

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x555560, 1.4));
      const sun = new THREE.DirectionalLight(0xfff2e0, 1.8);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.bias = -0.0008;
      scene.add(sun);
      scene.add(sun.target);
      // A lamp travelling with the viewer keeps the interior readable: the
      // ceiling we reconstruct blocks most of the directional light.
      const headLamp = new THREE.PointLight(0xffffff, 14, 20, 2);
      scene.add(headLamp);

      // HSSD stores its textures as KTX2/Basis (KHR_texture_basisu). Decoding
      // them here is exactly why the room is composed in the browser rather
      // than merged into one glTF in Python, where those textures are lost.
      const ktx2 = new KTX2Loader()
        .setTranscoderPath("https://unpkg.com/three@0.160.0/examples/jsm/libs/basis/")
        .detectSupport(renderer);
      const loader = new GLTFLoader().setKTX2Loader(ktx2);

      const loadGltf = (url) =>
        new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));

      let manifest = null;
      let yaw = 0;
      let pitch = 0;
      const groups = {};
      let activeMode = null;
      let runData = null;
      let runView = null;
      let runShow = null;
      let apartmentRuns = [];
      // Index into apartmentRuns. discover_runs sorts by directory name and
      // the convention is wNN, so the newest sorts last and that is the
      // default: opening an apartment on its oldest run means opening it on
      // the one whose defects have since been fixed. Sorting by name rather
      // than by date is the assumption; it holds while the convention does.
      let runChoice = 0;
      // Bumped by every buildAcousticMode() call, so a voxel-cloud fetch that
      // is still in flight when the run changes underneath it can tell, on
      // waking up, that it is no longer the current run and back off instead
      // of mutating whichever run is now on screen.
      let acousticGeneration = 0;
      // The tiered grid's follow-the-reader hook and the room it last drew.
      // Held beside the run state rather than inside the mode builder, because
      // the animation loop asks the hook where the camera is on every frame.
      let auditFollow = null;
      let auditRoom = null;
      // Where a reader should stand to look at the room now drawn, measured
      // against the grid rather than guessed from the bounds. Null until a
      // tiered grid is attached, which is what leaves the old behaviour in
      // place for a run that has one room and real receivers.
      let auditStand = null;

      function ringContains(x, z, ring) {
        let inside = false;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const [xi, zi] = ring[i];
          const [xj, zj] = ring[j];
          if (zi > z !== zj > z && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
        }
        return inside;
      }

      // A part is walkable where it is inside the exterior ring and outside
      // every hole: holes are the columns and shafts the apartment really has.
      function partContains(x, z, part) {
        if (!ringContains(x, z, part.exterior)) return false;
        return !part.holes.some((hole) => ringContains(x, z, hole));
      }

      function outlineContains(x, z) {
        return manifest.outline.some((part) => partContains(x, z, part));
      }

      function ringClearance(x, z, ring) {
        let best = Infinity;
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const [xi, zi] = ring[i];
          const [xj, zj] = ring[j];
          const dx = xj - xi;
          const dz = zj - zi;
          const lengthSquared = dx * dx + dz * dz;
          const t = lengthSquared === 0
            ? 0
            : Math.max(0, Math.min(1, ((x - xi) * dx + (z - zi) * dz) / lengthSquared));
          best = Math.min(best, Math.hypot(x - (xi + t * dx), z - (zi + t * dz)));
        }
        return best;
      }

      // "Inside" is the walkable outline: the rooms joined through the
      // doorways found in the stage's own walls, and the very same polygon the
      // shell is extruded from and the simulator receives. A doorway is only
      // about 0.9 m wide, so the clearance kept here has to be small enough to
      // pass through one.
      function canStandAt(x, z) {
        // The solver mesh is the apartment's own bedroom, cropped and not
        // recentred, so one outline governs every mode and walking across a
        // mode switch stays continuous. Until the apartment arrives there is no
        // outline, and the run's bounding box stands in for it.
        if (!manifest) {
          if (!runView) return false;
          const { min, max } = runView.bounds;
          return (
            x > min.x + WALL_MARGIN && x < max.x - WALL_MARGIN &&
            z > min.z + WALL_MARGIN && z < max.z - WALL_MARGIN
          );
        }
        if (!outlineContains(x, z)) return false;
        for (const part of manifest.outline) {
          if (!partContains(x, z, part)) continue;
          const rings = [part.exterior, ...part.holes];
          if (Math.min(...rings.map((ring) => ringClearance(x, z, ring))) < WALL_MARGIN) {
            return false;
          }
          return true;
        }
        return false;
      }

      function startingPosition() {
        // Spawn at the most open point of the largest part, so a narrow
        // doorway or a cluttered corner never traps the viewer at start.
        let best = null;
        let bestClearance = -Infinity;
        for (const part of manifest.outline) {
          const xs = part.exterior.map((p) => p[0]);
          const zs = part.exterior.map((p) => p[1]);
          const [minX, maxX] = [Math.min(...xs), Math.max(...xs)];
          const [minZ, maxZ] = [Math.min(...zs), Math.max(...zs)];
          for (let i = 1; i < 30; i++) {
            for (let j = 1; j < 30; j++) {
              const x = minX + ((maxX - minX) * i) / 30;
              const z = minZ + ((maxZ - minZ) * j) / 30;
              if (!partContains(x, z, part)) continue;
              const rings = [part.exterior, ...part.holes];
              const clearance = Math.min(...rings.map((ring) => ringClearance(x, z, ring)));
              if (clearance > bestClearance) {
                bestClearance = clearance;
                best = [x, z];
              }
            }
          }
        }
        return best || [0, 0];
      }

      const pressed = new Set();
      addEventListener("keydown", (event) => {
        if (event.code.startsWith("Arrow")) event.preventDefault();
        pressed.add(event.code);
      });
      addEventListener("keyup", (event) => pressed.delete(event.code));
      addEventListener("blur", () => pressed.clear());

      // Drag to look, deliberately not pointer lock: the cursor stays visible
      // and the page never captures the mouse, so nothing has to be released
      // with Esc before using the rest of the screen.
      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      const surface = renderer.domElement;
      surface.addEventListener("pointerdown", (event) => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        surface.classList.add("dragging");
        surface.setPointerCapture(event.pointerId);
      });
      const endDrag = (event) => {
        dragging = false;
        surface.classList.remove("dragging");
        if (event.pointerId !== undefined && surface.hasPointerCapture(event.pointerId)) {
          surface.releasePointerCapture(event.pointerId);
        }
      };
      // The wheel narrows the field of view and never widens it past where it
      // started. Zooming out would be a different view of the room rather than
      // a closer look at it, and a reader who has rolled out to a fish eye is
      // being shown angles that are not the ones the run measured.
      surface.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          const factor = Math.exp(event.deltaY * 0.0015);
          camera.fov = Math.min(BASE_FOV, Math.max(MIN_FOV, camera.fov * factor));
          camera.updateProjectionMatrix();
        },
        { passive: false },
      );
      surface.addEventListener("pointerup", endDrag);
      surface.addEventListener("pointercancel", endDrag);
      surface.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        yaw -= (event.clientX - lastX) * LOOK_SENSITIVITY;
        pitch -= (event.clientY - lastY) * LOOK_SENSITIVITY;
        pitch = Math.max(-MAX_PITCH, Math.min(MAX_PITCH, pitch));
        lastX = event.clientX;
        lastY = event.clientY;
      });

      function applyDisplaySettings(root, { flatColour, shadows }) {
        root.traverse((node) => {
          if (!node.isMesh) return;
          const materials = Array.isArray(node.material) ? node.material : [node.material];
          node.material = materials.map((material) => {
            const copy = material.clone();
            // Standing inside the room means looking at the back of every
            // wall, floor and ceiling face, since the shell keeps its outward
            // normals. Single sided rendering would leave the room wide open.
            copy.side = THREE.DoubleSide;
            if (flatColour) {
              copy.map = null;
              // Collider meshes carry vertex colours, which would otherwise
              // modulate the flat colour and make one object look striped.
              copy.vertexColors = false;
              copy.color = new THREE.Color(...flatColour.map((v) => v / 255));
              copy.metalness = 0;
              copy.roughness = 1;
            }
            return copy;
          });
          if (node.material.length === 1) node.material = node.material[0];
          node.castShadow = shadows;
          node.receiveShadow = shadows;
        });
      }

      async function buildAcousticMode() {
        // Claimed before the first await, and closed over by name (not read
        // off the shared `runData`/`runView` again after an await): switching
        // runs while this call's voxel-cloud fetch is still in flight used to
        // let the stale fetch's completion mutate whichever run had since
        // become current, silently drawing one run's grid into another's
        // scene. Local bindings can't be reassigned out from under a pending
        // await; only the module-level ones could.
        const generation = ++acousticGeneration;
        // The previous run's tiered grid is about to leave the scene, and the
        // animation loop must stop asking it which room the camera is in
        // before it does.
        auditFollow = null;
        auditRoom = null;
        auditStand = null;
        const data = await loadRun(apartmentRuns[runChoice].url);
        const view = buildRunGroup(THREE, data);
        // Narrower residual: if run.json fetches themselves resolved out of
        // order (two run switches close enough together), this assignment
        // could still lose to an older generation. Left alone rather than
        // guarded, because doing that right means deciding what an early
        // return here hands back to setMode's `await buildMode(mode)`, which
        // is a change to the mode-switching flow this fix does not make.
        runData = data;
        runView = view;
        if (view.markers) scene.add(view.markers);
        runShow = renderRunPanel(document.getElementById("run-panel"), data, {
          onSelect: (sample) => view.highlight(sample.source_index, sample.receiver_index),
          onStand: (sample) => standAt(sample.receiver_index, sample.yaw_deg),
        });
        // Voxels are what the acoustic mode is for, so they are the default and
        // the triangles are the alternative. The two are exclusive: they
        // describe the same boundary, so drawing both puts opaque faces exactly
        // where the points are and the points lose, which is how this shipped
        // looking like a mesh view with a checkbox that did nothing visible.
        // A run published with a tiered audit payload draws that instead: the
        // whole flat at the solver's own step exists in no other form, since
        // one payload of it is about 2.2 GB.
        if (data.audit) {
          await attachAuditGrid(data, view, generation);
          return view.group;
        }
        const toggle = document.getElementById("run-voxels");
        if (toggle) {
          let cloud = null;
          const apply = async () => {
            if (toggle.checked && !cloud) {
              toggle.disabled = true;
              setBusy("loading the grid…");
              cloud = await buildVoxelCloud(THREE, data);
              // Another buildAcousticMode() call has since started: this
              // fetch's result belongs to a run that is no longer on screen,
              // so it is dropped rather than attached anywhere.
              if (generation !== acousticGeneration) return;
              toggle.disabled = false;
              setBusy("");
              if (cloud) view.group.add(cloud);
            }
            if (generation !== acousticGeneration) return;
            // A run whose grid has been collected has no cloud to show; the
            // triangles stay rather than leaving an empty room.
            const voxels = toggle.checked && cloud !== null;
            if (cloud) cloud.visible = voxels;
            for (const surface of view.surfaces) surface.visible = !voxels;
          };
          toggle.onchange = apply;
          await apply();
        }
        return view.group;
      }

      /** Wire the tiered grid to the panel and to where the reader is standing.
       *
       * The dropdown and the walk both drive the same `select`, and "follow me"
       * is on by default because the whole point of the tiering is that the
       * step follows the reader rather than being chosen.
       */
      async function attachAuditGrid(data, view, generation) {
        const status = document.getElementById("audit-status");
        const say = (state) => {
          if (!status) return;
          const room = state.room ? `${state.room} at ${state.fine_mm.toFixed(2)} mm` : "no room";
          // The tile count is on screen because it is the one thing that can
          // make this picture incomplete: a room drawn 3 tiles of 8 is missing
          // the far end of itself, and a reader must not read that as geometry
          // the voxeliser lost.
          const tiles =
            state.tiles > 1
              ? `, ${state.tiles_drawn} of ${state.tiles} tiles (nearest first)`
              : "";
          const at = camera.position;
          status.textContent =
            `${room}${tiles}, everything else at ${state.coarse_mm.toFixed(2)} mm. ` +
            `${state.quads.toLocaleString()} quads drawn, about ${state.megabytes} MB. ` +
            // Where the reader is standing, because a defect is reported by
            // where it was seen from and the scene has no other landmark.
            `Standing at ${at.x.toFixed(2)}, ${at.y.toFixed(2)}, ${at.z.toFixed(2)}.`;
        };
        setBusy("loading the grid…");
        const grid = await buildAuditGrid(THREE, data, say);
        if (generation !== acousticGeneration) return;
        setBusy("");
        if (!grid) return;
        view.group.add(grid.group);
        // The tiered grid replaces the triangles rather than sitting behind
        // them: the two describe the same boundary, and drawing both puts
        // opaque faces exactly where the grid is.
        for (const surface of view.surfaces) surface.visible = false;
        // The camera stands by the run's bounds, and a page that ships no
        // triangles has none to compute them from -- which put the reader
        // nowhere and rendered black. The grid's own extent answers instead.
        view.bounds.copy(grid.bounds);
        // And a grid published without a solve has no receiver to stand at.
        // The middle of the run's bounding box is inside a wall or inside the
        // bed, and standing there fills the view with the crimson of a sealed
        // interior -- which reads as a broken page rather than as a camera
        // inside the mattress. The apartment's own spawn point is the most open
        // point of its walkable outline, which is exactly the right answer and
        // is already computed for the other three modes.
        auditStand = () => grid.standIn(auditRoom || grid.rooms[0].name);
        if (!data.receivers.length) {
          const at = auditStand();
          if (at) camera.position.set(at[0], grid.bounds.min.y + EYE_HEIGHT, at[1]);
        }

        const picker = document.getElementById("audit-room");
        const follow = document.getElementById("audit-follow");
        if (picker) {
          picker.onchange = () => {
            if (follow) follow.checked = false;
            auditRoom = picker.value;
            // Walk there as well as draw it. Picking a room from a list and
            // staying where you were shows the room you left, redrawn coarse.
            const at = grid.standIn(picker.value);
            if (at) camera.position.set(at[0], grid.bounds.min.y + EYE_HEIGHT, at[1]);
            grid.select(picker.value, camera.position);
            grid.say();
          };
        }
        // A large room is drawn nearest tiles first, so walking across it has
        // to bring the far end in. Re-checked against where the reader was when
        // the tiles were last chosen rather than every frame: `refresh` fetches,
        // and half a metre is well inside one tile.
        const chosenAt = new THREE.Vector3(Infinity, Infinity, Infinity);
        auditFollow = () => {
          if (!follow || !follow.checked) return;
          const here = grid.roomAt(camera.position.x, camera.position.z);
          if (here && here !== auditRoom) {
            auditRoom = here;
            if (picker) picker.value = here;
            chosenAt.copy(camera.position);
            grid.select(here, camera.position);
          } else if (auditRoom && chosenAt.distanceTo(camera.position) > 0.5) {
            chosenAt.copy(camera.position);
            grid.refresh(camera.position);
          } else if (auditRoom && chosenAt.distanceTo(camera.position) > 0.05) {
            grid.say();
          }
        };
        auditFollow();
        // Said again once the camera has been stood in a room: the first call
        // reported the position the reader was left at by the apartment, which
        // is not where they now are, and the whole point of the readout is that
        // a defect is reported by where it was seen from.
        grid.say();
      }

      /** Put the camera where a sample was heard from, facing the way it was decoded.
       *
       * The yaw matters and it is not decoration. A binaural render is made for
       * one head orientation, so standing at the right point facing the wrong
       * way shows a room whose sources are on the other side from where they
       * sound. Two frames have to be chained and both signs are silent:
       *
       * - the scene is Y up and the ambisonic frame is x front, y left, z up,
       *   related by (x, y, z) -> (x, -z, y), so ambisonic front is scene +x
       *   and ambisonic left is scene -z;
       * - the camera's own yaw t gives forward = (-sin t, 0, -cos t), so facing
       *   scene +x is t = -pi/2 and facing scene -z is t = 0.
       *
       * A head turned left by psi therefore wants t = -pi/2 + psi. Checked
       * against the run: the source is 75 degrees to the left, and at a head
       * yaw of +90 the interaural delay reverses, which is what standing here
       * and looking should show.
       */
      function standAt(receiverIndex, yawDeg) {
        if (!runView) return;
        if (Number.isFinite(yawDeg)) {
          yaw = -Math.PI / 2 + (yawDeg * Math.PI) / 180;
          pitch = 0;
        }
        const marker = runView.receivers[receiverIndex];
        if (marker) {
          // Put the head where the receiver was, so what is heard and what is
          // seen come from the same point in the room.
          camera.position.copy(marker.position);
          return;
        }
        // A grid published without a solve has no receiver to stand at, and the
        // camera would otherwise stay wherever it was left -- which on a first
        // load is the origin, and the origin of this scene is in the floor. The
        // room then renders as one flat wall of colour and reads as a broken
        // page rather than as a camera inside the carpet.
        //
        // The middle of the bounds answers that for one room and not for a
        // flat: the centre of thirteen rooms is inside a wall, and this took
        // the camera straight back out of the room the tiered grid had just
        // stood it in. A tiered grid ships a measured standing point per room,
        // so it is asked first.
        if (auditStand) {
          const at = auditStand();
          if (at) {
            camera.position.set(at[0], runView.bounds.min.y + EYE_HEIGHT, at[1]);
            return;
          }
        }
        const { min, max } = runView.bounds;
        camera.position.set((min.x + max.x) / 2, min.y + EYE_HEIGHT, (min.z + max.z) / 2);
      }

      async function buildMode(mode) {
        if (mode === "acoustic") return buildAcousticMode();
        const group = new THREE.Group();
        const shell = await loadGltf(`${base}shell_${mode}.glb`);
        applyDisplaySettings(shell.scene, { flatColour: null, shadows: mode === "colour" });
        group.add(shell.scene);

        const cache = new Map();
        for (const entry of manifest.instances) {
          const url = entry.render_url;
          if (!url) continue; // counted in the report, not silently ignored
          if (!cache.has(url)) cache.set(url, loadGltf(base + url));
          const gltf = await cache.get(url);
          const piece = gltf.scene.clone(true);
          const flatColour = mode === "label" ? entry.label_colour : null;
          applyDisplaySettings(piece, { flatColour, shadows: mode === "colour" });
          // Our instance matrix, applied whole: if a piece lands wrongly, the
          // reconstruction is wrong, because the viewer adds no correction.
          piece.matrixAutoUpdate = false;
          piece.matrix.fromArray(entry.matrix);
          group.add(piece);
        }
        return group;
      }

      function fitSunTo(group) {
        const box = new THREE.Box3().setFromObject(group);
        const centre = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        sun.position.set(centre.x + size.x, box.max.y + size.y, centre.z + size.z);
        sun.target.position.copy(centre);
        const extent = Math.max(size.x, size.z);
        Object.assign(sun.shadow.camera, {
          left: -extent,
          right: extent,
          top: extent,
          bottom: -extent,
          far: extent * 4,
        });
        sun.shadow.camera.updateProjectionMatrix();
      }

      function renderLegend(mode) {
        const entries = (manifest && manifest.legends[mode]) || [];
        document.getElementById("legend").innerHTML = entries
          .map(
            (entry) =>
              `<div class="entry"><span class="swatch" style="background: rgb(${entry.colour.join(
                ","
              )})"></span>${entry.label}</div>`
          )
          .join("");
      }

      /** Load the run's payload and put its markers in the scene, in any mode.
       *
       * Separate from ``buildAcousticMode`` because the two answer different
       * questions. That builds the solver's surfaces, which belong to one mode.
       * This puts the source, the listening point and the array's own ball in
       * front of a reader who is listening, whichever mode they are looking at,
       * and hands the panel its samples.
       */
      async function ensureRunLoaded() {
        if (!apartmentRuns.length || runData) return;
        const data = await loadRun(apartmentRuns[runChoice].url);
        const view = buildRunGroup(THREE, data);
        runData = data;
        runView = view;
        if (view.markers) scene.add(view.markers);
        runShow = renderRunPanel(document.getElementById("run-panel"), data, {
          onSelect: (sample) => view.highlight(sample.source_index, sample.receiver_index),
          onStand: (sample) => standAt(sample.receiver_index, sample.yaw_deg),
        });
      }

      async function setMode(mode) {
        if (mode === "acoustic" && !apartmentRuns.length) return;
        if (mode !== "acoustic") await ensureRunLoaded();
        // Record the deliberate choice before the first await, not after it.
        // Assigning it at the end let a cached assembly finish inside those
        // awaits, read `chosen` as still unset, and take the view back to
        // colour, so opening on the simulated room only worked on a cold cache.
        chosen = mode;
        for (const name of MODES) {
          document.getElementById(`btn-${name}`).classList.toggle("active", name === mode);
        }
        renderLegend(mode === "acoustic" ? null : mode);
        setBusy(mode === "acoustic" && !groups.acoustic ? "loading solver run…" : assemblyMessage);
        if (!groups[mode]) groups[mode] = await buildMode(mode);
        if (activeMode && groups[activeMode]) scene.remove(groups[activeMode]);
        // The solver mode reads only the run payload, so it can be shown while
        // the apartment is still being assembled. The other three are the
        // assembly, and have nothing to draw until it arrives.
        if (!manifest && mode !== "acoustic") return;
        scene.add(groups[mode]);
        fitSunTo(groups[mode]);

        // The panel stays on every mode once a run has been loaded. Listening
        // and looking are the same act here: a reader comparing two head
        // orientations wants the colour view or the material labels in front of
        // them while they do it, and hiding the audio on three modes out of
        // four made the run something you could only hear from inside the grid.
        const panel = document.getElementById("run-panel");
        panel.hidden = !runData;
        activeMode = mode;
        // The camera is deliberately left alone. All three modes draw the same
        // room in the same frame, so switching between them is a change of
        // representation and not a change of place; moving the viewer here
        // would lose whatever they had walked over to look at.
        if (!panel.hidden) {
          // Redraw once the panel has its real width, otherwise every plot is
          // sized from a hidden element and comes out a pixel wide. Redraw the
          // sample the reader picked, not the first one: this is a change of
          // representation of the same room, so it must not silently move them
          // back to the ambisonic row while their ears are on a decode.
          requestAnimationFrame(() => {
            const pick = document.getElementById("run-pick");
            if (runShow) runShow(pick ? Number(pick.value) : 0);
          });
        }
        setBusy(assemblyMessage);
      }

      // Which mode the viewer is showing on purpose, as opposed to which one
      // has finished loading. Cleared when an apartment starts loading.
      let chosen = null;
      // What the apartment load wants the status line to say. Held here because
      // opening the solver run mid assembly used to blank the status line on
      // its way out, leaving the only sign of a minutes long build with nothing
      // on screen to say it was still running.
      let assemblyMessage = "";

      document.getElementById("run-choice").onchange = async (event) => {
        // Drop the built group as well as the payload: it holds the previous
        // run's surfaces, and adding the new one beside it would draw two
        // rooms at once.
        runChoice = Number(event.target.value);
        if (groups.acoustic) scene.remove(groups.acoustic);
        groups.acoustic = null;
        // The markers live outside the mode group now, so they have to be taken
        // out by name or the previous run's source stays on screen beside the
        // new one's.
        if (runView && runView.markers) scene.remove(runView.markers);
        runData = runView = runShow = null;
        await setMode(activeMode || "acoustic");
      };

      for (const mode of MODES) {
        document.getElementById(`btn-${mode}`).onclick = () => setMode(mode);
      }

      const forward = new THREE.Vector3();
      const right = new THREE.Vector3();
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.1);
        camera.rotation.set(pitch, yaw, 0);
        forward.set(-Math.sin(yaw), 0, -Math.cos(yaw));
        right.set(Math.cos(yaw), 0, -Math.sin(yaw));

        let stepX = 0;
        let stepZ = 0;
        const distance = WALK_SPEED * delta;
        const push = (vector, sign) => {
          stepX += vector.x * distance * sign;
          stepZ += vector.z * distance * sign;
        };
        // The arrows walk and turn; the letters strafe. Turning on the spot is
        // what a listener does to hear a source move, and it is the gesture the
        // binaural renders are made for, so it belongs on the keys nearest to
        // hand. Strafing stays on A and D for anyone who wants it.
        if (pressed.has("KeyW") || pressed.has("ArrowUp")) push(forward, 1);
        if (pressed.has("KeyS") || pressed.has("ArrowDown")) push(forward, -1);
        if (pressed.has("KeyD")) push(right, 1);
        if (pressed.has("KeyA")) push(right, -1);
        if (pressed.has("ArrowLeft")) yaw += TURN_SPEED * delta;
        if (pressed.has("ArrowRight")) yaw -= TURN_SPEED * delta;

        if (stepX !== 0 || stepZ !== 0) {
          const { x, z } = camera.position;
          if (canStandAt(x + stepX, z + stepZ)) {
            camera.position.x = x + stepX;
            camera.position.z = z + stepZ;
          } else if (canStandAt(x + stepX, z)) {
            camera.position.x = x + stepX; // slide along the wall
          } else if (canStandAt(x, z + stepZ)) {
            camera.position.z = z + stepZ;
          }
        }
        headLamp.position.copy(camera.position);
        // The array's ball gets out of the way once the camera is inside it.
        // Standing at the listening point is standing at its centre, and a
        // wire sphere seen from within is a cage across the view rather than a
        // measurement of anything.
        if (runView && runView.markers) {
          for (const marker of runView.markers.children) {
            const within = marker.userData && marker.userData.hideWithin;
            if (within) marker.visible = camera.position.distanceTo(marker.position) > within;
          }
        }
        // Checked every frame rather than on every step, because the camera
        // also moves by "stand at this receiver" and by a mode switch, and a
        // reader teleported into the kitchen must see the kitchen.
        if (auditFollow) auditFollow();
        renderer.render(scene, camera);
      }

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      // Test hook: lets an automated check assert that the walk camera never
      // leaves the room, which is otherwise only verifiable by eye.
      window.reverberate = {
        position: () => camera.position.toArray(),
        canStandAt,
      };

      let base = "";

      function setBusy(text) {
        document.getElementById("busy").textContent = text;
      }

      // Point the run at an apartment, dropping whatever the last one had.
      //
      // Called with the *incoming* scene before the manifest is fetched. Doing
      // it afterwards left the Solver button offering the outgoing apartment's
      // run for the whole of a multi second assembly, ready to open it over a
      // room it was never simulated in. Doing it beforehand also makes the run
      // available immediately, which is correct: a run payload is published by
      // the solver and owes nothing to the HSSD assembly.
      // `wanted` is the run the reader actually asked for. Without it this
      // fell back to the last run of the apartment, so choosing one run in the
      // selector opened another: the selector said w37_listen while the panel
      // and the audio player were still on w37_three_band, with nothing on
      // screen to say so. A page that names one rendering and plays another is
      // the worst kind of defect for a listening test, because the listener
      // has no way to notice.
      function releaseRun(sceneId, wanted = null) {
        // The built group goes with the payload. Nulling only the payload left
        // the outgoing run's surfaces in the scene, and `setMode` then found a
        // group already there and returned without rebuilding: the selector
        // moved, `runChoice` moved, and the panel and the audio did not. The
        // run picker's own handler had always done this; the scene selector's
        // path did not, which is why one worked and the other did not.
        if (groups.acoustic) scene.remove(groups.acoustic);
        groups.acoustic = null;
        // The markers are a second group and a second removal. `buildRunGroup`
        // lifts the source, the listening point and the array sphere out of
        // the surfaces so they can show in all three views, and leaving them
        // behind would draw the outgoing run's source over the incoming one
        // with nothing to say so.
        if (runView && runView.markers) scene.remove(runView.markers);
        runData = runView = runShow = null;
        document.getElementById("run-panel").hidden = true;
        apartmentRuns = sceneId ? runsByScene.get(sceneId) || [] : [];
        const button = document.getElementById("btn-acoustic");
        button.disabled = !apartmentRuns.length;
        button.title = apartmentRuns.length
          ? `solver run: ${apartmentRuns.map((r) => r.name).join(", ")}`
          : "no solver run has been rendered for this apartment";
        // Three sources, in this order. What the reader just asked for wins,
        // because they asked for it. Failing that, the run the server marked
        // as the one to lead with: `runs.json` carries a `lead` flag that
        // `--run NAME` sets. Last of the apartment only when nothing at all
        // has been said.
        const asked = wanted ? apartmentRuns.findIndex((r) => r.name === wanted) : -1;
        const lead = asked >= 0 ? -1 : apartmentRuns.findIndex((r) => r.lead);
        runChoice = asked >= 0 ? asked : lead >= 0 ? lead : Math.max(0, apartmentRuns.length - 1);
        const picker = document.getElementById("run-choice");
        picker.hidden = apartmentRuns.length < 2;
        picker.innerHTML = apartmentRuns
          .map((r, i) => `<option value="${i}">${r.name}</option>`)
          .join("");
        picker.value = String(runChoice);
        // A disabled button must not still look like the mode you are in. The
        // next setMode is minutes away, behind the apartment assembly, so
        // leaving the highlight up says the acoustic view is on screen for the
        // whole of a wait during which nothing is.
        if (button.disabled) button.classList.remove("active");
      }

      async function loadApartment(sceneId, wantedRun = null) {
        assemblyMessage = "building apartment… (first load of a scene takes a while)";
        setBusy(assemblyMessage);
        // Nothing of the outgoing apartment may survive the wait, including the
        // mode buttons, which is why this runs before the fetch and not after.
        releaseRun(sceneId, wantedRun);
        chosen = null;
        if (activeMode === "acoustic") activeMode = null;
        // The server assembles a scene on demand: 168 apartments could not be
        // exported up front, and each one is cached after its first build.
        const response = await fetch(`scenes/${sceneId}/manifest.json`);
        if (!response.ok) {
          assemblyMessage = "";
          setBusy(`failed to build ${sceneId}: ${response.status}`);
          return;
        }
        manifest = await response.json();
        base = `scenes/${sceneId}/`;
        // The assembly invalidates the three modes built from it. It says
        // nothing about the solver mode, which is built from the run payload,
        // so a run opened during the wait survives its arrival intact.
        for (const mode of SCENE_MODES) groups[mode] = null;
        if (activeMode && activeMode !== "acoustic" && scene.children.includes(groups[activeMode])) {
          scene.remove(groups[activeMode]);
        }
        if (activeMode !== "acoustic") activeMode = null;
        assemblyMessage = "";
        document.getElementById("title").textContent = manifest.title;
        document.getElementById("report").textContent = manifest.hint;
        // Only claim the view if the wait did not already give it away: someone
        // who opened the solver run while the apartment assembled should not be
        // yanked out of it, nor have the camera moved under them.
        if (chosen === null) {
          const [x, z] = startingPosition();
          camera.position.set(x, manifest.floorHeight + EYE_HEIGHT, z);
          yaw = 0;
          pitch = 0;
          await setMode("colour");
        }
        setBusy("");
      }

      const runsByScene = new Map();
      const runsByName = new Map();

      async function boot() {
        // Runs first: the selector marks which apartments have one, so a run is
        // discoverable from the list rather than only by already knowing.
        const runs = await fetch("runs.json")
          .then((response) => (response.ok ? response.json() : []))
          .catch(() => []);
        for (const run of runs) {
          if (!runsByScene.has(run.scene_id)) runsByScene.set(run.scene_id, []);
          runsByScene.get(run.scene_id).push(run);
          runsByName.set(run.name, run);
        }

        const apartments = await fetch("apartments.json").then((r) => r.json());
        const select = document.getElementById("scene-select");
        // Each simulated room gets its own entry above the apartments. It is a
        // way into the same apartment, not a second scene, so the three modes
        // and the walk behave there exactly as they do everywhere else. It
        // leads because a room with a run is the only place all three modes
        // have something to show.
        select.innerHTML = [
          // The run's own name is on the option because it is the only part
          // that differs: twelve runs of one flat all read "102344022 ·
          // bedroom.001 · simulated", and a reader cannot pick one from that.
          ...runs.map((r) => `<option value="run:${r.name}">${r.name} · ${r.scene_id} · ${r.room}</option>`),
          ...apartments.map((a) => `<option value="${a.id}">${a.label}</option>`),
        ].join("");
        select.onchange = () => openSelection(select.value);
        await openSelection(select.value);
      }

      async function openSelection(value) {
        const run = value.startsWith("run:") ? runsByName.get(value.slice(4)) : null;
        // Not awaited yet: assembling an apartment takes minutes on a first
        // visit, and the run is ready now. Opening it first is what makes the
        // simulated room the one entry that shows something immediately.
        const assembling = loadApartment(run ? run.scene_id : value, run ? run.name : null);
        if (run) {
          await setMode("acoustic");
          // Guarded: setMode can return without a payload when the run fails
          // to load, and throwing here used to abandon the apartment assembly
          // that is still in flight below.
          if (runData) standAt(runData.samples[0]?.receiver_index ?? 0);
        }
        await assembling;
      }

      boot().catch((error) => {
        document.getElementById("title").textContent = `failed to load: ${error}`;
      });

      animate();
    </script>
  </body>
</html>
