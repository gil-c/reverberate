<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene player</title>
    <link rel="stylesheet" href="parts/parts.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
      main.p-page { max-width: 1180px; }
      #scene { height: 460px; }
      #timeline { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
      #tracks .p-track { grid-template-columns: 14px 15em auto auto minmax(120px, 1fr) 4.5em 110px; }
    </style>
  </head>
  <body>
    <main class="p-page">
      <header>
        <h1>Scene player</h1>
        <p id="what"></p>
      </header>
      <section class="p-card">
        <div id="scene"></div>
        <p class="p-scene-said" id="said"></p>
        <p class="p-note" id="scene-note">A head is a person, a cube is a noise. Each lights while it sounds. The white head is you, and the people you talk with stand on a green ring. Drag to look around, wheel to zoom.</p>
      </section>
      <section class="p-card">
        <div id="transport"></div>
        <div id="timeline"></div>
      </section>
      <section class="p-card">
        <h2>Volume of each source</h2>
        <div id="tracks"></div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
